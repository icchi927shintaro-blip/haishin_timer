<!doctype html>
<html lang="ja" data-page="display" data-release="20261031.4">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大学サッカー / 新デザイン表示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="broadcast-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Zen+Kaku+Gothic+Antique:wght@500;700;900&amp;display=swap" media="print" onload="this.media='all';document.documentElement.dataset.fonts='available'" onerror="document.documentElement.dataset.fonts='fallback'">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{position:relative;font-family:"Zen Kaku Gothic Antique","Yu Gothic",Meiryo,sans-serif}
#scoreboard{position:absolute;top:40px;left:24px;width:min(640px,calc(100vw - 48px))}
#score-strip{display:grid;grid-template-columns:minmax(0,1fr) 84px 12px 84px minmax(0,1fr);height:64px;align-items:stretch;background:#111719;color:#fff}
.team-name{display:flex;align-items:center;justify-content:center;min-width:0;padding:0 12px;font-size:32px;font-weight:900;line-height:1.2}
.team-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#team-home{background:var(--home-color,#187fc4);color:var(--home-text,#fff)}
#team-away{background:var(--away-color,#f5d321);color:var(--away-text,#111)}
.score-number{position:relative;top:-18px;font-family:"Barlow Condensed",Arial,sans-serif;font-size:96px;font-weight:800;line-height:64px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-1px;overflow:visible}
.score-number[data-digits="2"]{font-size:76px}
.score-number[data-digits="3"]{font-size:50px}
#timer-wrapper{width:126px;height:36px;margin:0 auto;background:#fff;color:#0e1920;display:flex;align-items:center;justify-content:center}
#timer{font-family:"Barlow Condensed",Arial,sans-serif;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
#timer-wrapper.stoppage{background:#d9eefa}
#warning{position:absolute;top:140px;left:24px;background:#821d1d;color:white;padding:10px;font:16px sans-serif}
#popup{--portrait-width:104px;position:absolute;right:clamp(16px,3.125vw,60px);bottom:clamp(16px,5.556vh,60px);width:min(480px,calc(100vw - 32px));box-sizing:border-box;padding:14px 20px 16px;background:var(--popup-color,#187fc4);color:var(--popup-text,white);overflow:hidden;opacity:0;visibility:hidden;transform:translateX(12px);transition:opacity .18s ease-in,transform .18s ease-in,visibility .18s}
#popup.visible{opacity:1;visibility:visible;transform:translateX(0);transition-duration:.25s}
#popup[data-kind="goal"]{min-height:132px}
#popup[data-kind="substitution"]{min-height:172px}
.popup-layout{display:grid;grid-template-columns:minmax(0,1fr)}
.popup-content{min-width:0}
.popup-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:12px}
#popup-type-label{font-size:13px;font-weight:700;line-height:1.4;white-space:nowrap;flex-shrink:0}
#popup-team-label{font-size:14px;font-weight:500;line-height:1.4;letter-spacing:.04em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#popup-player{display:grid;grid-template-columns:28px 46px minmax(0,1fr);align-items:center;column-gap:14px;height:60px;min-width:0}
.position-label{font:700 14px/1 "Barlow Condensed",Arial,sans-serif;letter-spacing:.04em}
#popup-number-label{font:700 50px/1 "Barlow Condensed",Arial,sans-serif;text-align:center;font-variant-numeric:tabular-nums}
#popup-name-label{font-size:30px;font-weight:700;line-height:1.2;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#popup-substitution{display:none}
#popup[data-kind="substitution"] #popup-player{display:none}
#popup[data-kind="substitution"] #popup-substitution{display:block}
.sub-player{display:grid;grid-template-columns:36px 26px 40px minmax(0,1fr);align-items:center;column-gap:12px;height:54px;min-width:0}
.sub-tag{display:flex;align-items:center;justify-content:center;height:22px;border-radius:2px;color:#fff;font:700 12px/1 "Barlow Condensed",Arial,sans-serif;letter-spacing:.04em}
.sub-tag.out{background:#8e2438}
.sub-tag.in{background:#155d48}
.sub-number{font:700 40px/1 "Barlow Condensed",Arial,sans-serif;text-align:center;font-variant-numeric:tabular-nums}
.sub-name{font-size:26px;font-weight:700;line-height:1.2;letter-spacing:.04em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 将来の得点者顔写真用。現在は非表示で、空白の領域も確保しない。 */
#popup-portrait{margin:0;min-width:0;align-self:stretch;overflow:hidden}
#popup-portrait[hidden]{display:none}
#popup-portrait img{display:block;width:100%;height:100%;object-fit:cover}
#popup[data-kind="goal"].has-portrait{width:min(600px,calc(100vw - 32px))}
#popup[data-kind="goal"].has-portrait .popup-layout{grid-template-columns:minmax(0,1fr) var(--portrait-width);gap:16px}
@media(max-width:600px){
 #scoreboard{top:32px;left:16px;width:calc(100vw - 32px)}
 #score-strip{grid-template-columns:minmax(0,1fr) 58px 8px 58px minmax(0,1fr);height:52px}
 .team-name{font-size:20px;padding:0 6px}
 .score-number{top:-14px;font-size:68px;line-height:52px}
 .score-number[data-digits="2"]{font-size:48px}
 .score-number[data-digits="3"]{font-size:32px}
 #timer-wrapper{height:30px;width:100px}
 #timer{font-size:25px}
 #popup{padding:12px 14px}
 #popup-player{grid-template-columns:24px 38px minmax(0,1fr);gap:10px}
 #popup-number-label{font-size:44px}
 #popup-name-label{font-size:26px}
 .sub-player{grid-template-columns:32px 22px 34px minmax(0,1fr);gap:8px}
 .sub-number{font-size:34px}
 .sub-name{font-size:23px}
 #popup[data-kind="goal"].has-portrait{--portrait-width:80px}
}
@media(prefers-reduced-motion:reduce){#popup,#popup.visible{transition:none;transform:none}}
</style>
</head>
<body>
<aside id="app-loader" role="status" style="box-sizing:border-box;position:relative;z-index:10000;max-width:808px;margin:12px auto;padding:12px;background:#eef6fc;color:#17364d;font:14px sans-serif;border:1px solid #b5cddd" hidden>
<span id="app-load-message">最新版を確認しています…</span>
<button id="app-load-retry" type="button" hidden>再確認して読み直す</button>
<button id="app-load-check" type="button" hidden>更新を確認</button>
<button id="app-load-update" type="button" hidden>保存して最新版へ更新</button>
<button id="app-load-backup" type="button" hidden>保存データを取り出す</button>
</aside>
<div id="scoreboard">
 <div id="score-strip">
  <div id="team-home" class="team-name"><span id="team-home-label">HOME</span></div>
  <div id="score-home" class="score-number">-</div>
  <div aria-hidden="true"></div>
  <div id="score-away" class="score-number">-</div>
  <div id="team-away" class="team-name"><span id="team-away-label">AWAY</span></div>
 </div>
 <div id="timer-wrapper"><div id="timer">--:--</div></div>
</div>
<div id="warning" hidden></div>
<div id="popup" role="status" aria-live="polite" aria-hidden="true">
 <div class="popup-layout">
  <div class="popup-content">
   <div class="popup-header"><div id="popup-team-label"></div><div id="popup-type-label"></div></div>
   <div id="popup-player"><span id="popup-position-label" class="position-label"></span><span id="popup-number-label"></span><span id="popup-name-label"></span></div>
   <div id="popup-substitution">
    <div class="sub-player"><span class="sub-tag out">OUT</span><span id="popup-out-position" class="position-label"></span><span id="popup-out-number" class="sub-number"></span><span id="popup-out-name" class="sub-name"></span></div>
    <div class="sub-player"><span class="sub-tag in">IN</span><span id="popup-in-position" class="position-label"></span><span id="popup-in-number" class="sub-number"></span><span id="popup-in-name" class="sub-name"></span></div>
   </div>
  </div>
  <!-- 顔写真機能を追加するときに、この右側の領域を使用する。 -->
  <figure id="popup-portrait" hidden aria-hidden="true"></figure>
 </div>
</div>


<!--release-loader:start-->
<script>
(async () => {
  'use strict';
  const doc = document.documentElement;
  const control = doc.dataset.page === 'control';
  const currentRelease = doc.dataset.release;
  const banner = document.getElementById('app-loader');
  const label = document.getElementById('app-load-message');
  const retry = document.getElementById('app-load-retry');
  const update = document.getElementById('app-load-update');
  const checkButton = document.getElementById('app-load-check');
  const recoveryButton = document.getElementById('app-load-backup');
  const main = document.querySelector('main');
  let started = false, checking = false, latest;
  if (main) main.inert = true;
  function tell(text, failed = false) {
    banner.hidden = !control && !failed;
    label.textContent = text;
  }
  function roomKey() {
    const room = new URLSearchParams(location.hash.slice(1)).get('room');
    return room && /^[a-zA-Z0-9_-]{8,80}$/.test(room)
      ? 'haishin-design-v1:' + room + (control ? ':control' : ':display') : null;
  }
  async function getManifest() {
    const url = new URL('./release.json', location.href);
    url.searchParams.set('check', Date.now() + '-' + Math.random().toString(36).slice(2));
    const res = await fetch(url, {cache:'no-store'});
    if (!res.ok) throw Error('release.jsonを取得できません（HTTP ' + res.status + '）');
    const manifest = await res.json();
    if (manifest.schemaVersion !== 1 || manifest.hashFormat !== 'utf8-lf-trim-end' || !/^[a-zA-Z0-9._-]{1,64}$/.test(manifest.release) ||
        !manifest.files || !manifest.files['design.js'] || !manifest.files['roster_design.js'])
      throw Error('release.jsonの形式が不正です');
    return manifest;
  }
  function navigate(release) {
    window.AppLifecycle?.beforeReload();
    const url = new URL(location.href);
    if (release) url.searchParams.set('appRelease', release);
    url.searchParams.set('reload', String(Date.now()));
    // URLの#room=...は変更しない。
    location.replace(url.href);
  }
  retry.onclick = () => {
    try { navigate(latest?.release); }
    catch(error) { tell('更新前の保存に失敗しました：' + error.message, true); }
  };
  update.onclick = retry.onclick;
  function backup(manifest) {
    const key = roomKey();
    if (!key || !control) return;
    const backupKey = key + ':upgrade-backup';
    const oldBackup = localStorage.getItem(backupKey);
    let oldRelease;
    try { oldRelease = oldBackup ? JSON.parse(oldBackup).release : null; } catch {}
    if (oldRelease === manifest.release) return;
    const state = localStorage.getItem(key);
    const draft = localStorage.getItem(key + ':roster-draft');
    if (state !== null || draft !== null) {
      localStorage.setItem(backupKey, JSON.stringify({
        format:'haishin-upgrade-backup', version:1, release:manifest.release,
        savedAt:new Date().toISOString(), state, draft
      }));
    }
  }
  recoveryButton.onclick = () => {
    try {
      const key = roomKey();
      if (!key) throw Error('ルームIDがありません');
      const data = {
        format:'haishin-recovery', version:1,
        state:localStorage.getItem(key), draft:localStorage.getItem(key + ':roster-draft'),
        beforeUpdate:localStorage.getItem(key + ':upgrade-backup')
      };
      const url = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
      const a = document.createElement('a');
      a.href = url; a.download = 'haishin-recovery.json'; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    } catch(error) { tell('バックアップを取り出せません：' + error.message,true); }
  };
  async function verifiedSource(file, manifest) {
    const expected = manifest.files[file];
    if (!/^[0-9a-f]{64}$/.test(expected || '')) throw Error(file + 'の検証情報がありません');
    const url = new URL('./' + file,location.href);
    url.searchParams.set('release',manifest.release);
    const res = await fetch(url,{cache:'no-store'});
    if (!res.ok) throw Error(file + 'を取得できません（HTTP ' + res.status + '）');
    const bytes = await res.arrayBuffer();
    const source = new TextDecoder().decode(bytes).replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').trimEnd();
    const digest = await crypto.subtle.digest('SHA-256',new TextEncoder().encode(source));
    const actual = Array.from(new Uint8Array(digest),n=>n.toString(16).padStart(2,'0')).join('');
    if (actual !== expected) throw Error(file + 'の版が一致しません。公開反映の完了後に再確認してください');
    return source;
  }
  function script(url) {
    return new Promise((resolve,reject)=>{
      const tag = document.createElement('script');
      tag.src = url; tag.onload = resolve;
      tag.onerror = ()=>reject(Error('スクリプトを読み込めません：' + url));
      document.body.append(tag);
    });
  }
  async function execute(source) {
    const url = URL.createObjectURL(new Blob([source],{type:'text/javascript'}));
    try { await script(url); } finally { URL.revokeObjectURL(url); }
  }
  async function checkUpdates() {
    if (!started || checking) return;
    checking = true;
    try {
      latest = await getManifest();
      if (latest.release !== currentRelease) {
        if (control) {
          update.hidden = false;
          tell('新しい版 ' + latest.release + ' が公開されました。下書きと試合状態を保存して更新できます。');
        }
      } else if (control) {
        update.hidden = true;
        tell('使用中：' + currentRelease + '（最新版）');
      }
    } catch {
      if (control) tell('更新を確認できません。現在の版 ' + currentRelease + ' で操作を続けられます。');
    } finally { checking = false; }
  }
  checkButton.onclick = checkUpdates;
  try {
    tell('最新版を確認しています…');
    latest = await getManifest();
    const marker = 'haishin-html-reload:' + location.pathname + ':' + latest.release;
    if (latest.release !== currentRelease) {
      if (sessionStorage.getItem(marker))
        throw Error('HTMLの公開反映がまだ揃っていません。少し待って再確認してください');
      sessionStorage.setItem(marker,'1');
      navigate(latest.release);
      return;
    }
    sessionStorage.removeItem(marker);
    const required = control
      ? ['homeShortName','homeColor','bulk-check','popup-out','confirmed-player-list']
      : ['scoreboard','team-home-label','popup-position-label','popup-in-position'];
    if (required.some(id=>!document.getElementById(id)))
      throw Error('HTMLの内容がこの版と一致しません。正しいファイルをアップロードしてください');
    const files = control ? ['roster_design.js','design.js'] : ['design.js'];
    // 全ファイルの検証が済むまでアプリを初期化しない。
    const sources = await Promise.all(files.map(file=>verifiedSource(file,latest)));
    backup(latest);
    if (!window.mqtt) await script('https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js');
    if (!window.mqtt) throw Error('通信ライブラリを読み込めません');
    for (const source of sources) await execute(source);
    if (!window.AppLifecycle?.started)
      throw Error(window.AppLifecycle?.error || 'アプリの初期化を完了できませんでした');
    started = true;
    if (main) main.inert = false;
    retry.hidden = true;
    checkButton.hidden = !control;
    recoveryButton.hidden = !control;
    tell('使用中：' + currentRelease + '（最新版）');
    // 開いている最中は通知のみ。配信・入力を中断する自動再読込はしない。
    if (control) {
      setInterval(checkUpdates,60000);
      document.addEventListener('visibilitychange',()=>{
        if (!document.hidden) checkUpdates();
      });
    }
  } catch(error) {
    console.error('読み込みエラー',error);
    retry.hidden = false;
    recoveryButton.hidden = !control;
    tell('読み込みを完了できません：' + error.message + '。保存済みデータは消していません。',true);
  }
})();
</script>
<!--release-loader:end-->
</body>
</html>
