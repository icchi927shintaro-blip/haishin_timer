<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大学サッカー / 新デザイン表示</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{position:relative;font-family:"Yu Gothic","Meiryo",sans-serif}
#scoreboard{position:absolute;top:40px;left:24px;width:min(640px,calc(100vw - 48px))}
#score-strip{display:grid;grid-template-columns:minmax(0,1fr) 108px 12px 108px minmax(0,1fr);height:64px;align-items:stretch;background:#121516;color:#fff}
.team-name{display:flex;align-items:center;justify-content:center;min-width:0;padding:0 10px;font-size:32px;font-weight:700}
.team-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#team-home{background:var(--home-color,#187fc4);color:var(--home-text,#fff)}
#team-away{background:var(--away-color,#f5d321);color:var(--away-text,#111)}
.score-number{position:relative;top:-18px;font-family:Arial,sans-serif;font-size:96px;font-weight:800;line-height:64px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-4px;overflow:visible}
#timer-wrapper{width:126px;height:36px;margin:0 auto;background:#fff;color:#111;display:flex;align-items:center;justify-content:center}
#timer{font-family:Arial,sans-serif;font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#timer-wrapper.stoppage{background:#d9eefa}
#warning{position:absolute;top:140px;left:24px;background:#821d1d;color:white;padding:10px;font:16px sans-serif}
#popup{position:absolute;right:clamp(16px,3.125vw,60px);bottom:clamp(16px,5.556vh,60px);width:min(440px,calc(100vw - 32px));box-sizing:border-box;padding:10px 16px;background:#187fc4;color:white;overflow:hidden;opacity:0;visibility:hidden;transform:translateX(24px);transition:opacity .3s,transform .3s,visibility .3s}
#popup.visible{opacity:1;visibility:visible;transform:translateX(0)}
#popup-type-label{font-size:16px;font-weight:700;line-height:1.3}
#popup-team-label{font-size:14px;line-height:1.4;margin:3px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#popup-player,.sub-player{display:flex;align-items:center;gap:12px;min-width:0}
#popup-player{height:48px}
#popup-number-label,.sub-number{font:42px Impact,Arial,sans-serif;min-width:50px}
#popup-name-label,.sub-name{font-size:26px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#popup-substitution{display:none}
#popup[data-kind="substitution"] #popup-player{display:none}
#popup[data-kind="substitution"] #popup-substitution{display:block}
.sub-player{height:44px}
.sub-tag{font:700 14px Arial,sans-serif;width:38px;flex-shrink:0}
.sub-tag.out{color:#ffe1df}
.sub-tag.in{color:#caffd4}
.sub-number{font-size:32px;min-width:40px}
.sub-name{font-size:23px}
@media(max-width:600px){
 #scoreboard{top:32px;left:16px;width:calc(100vw - 32px)}
 #score-strip{grid-template-columns:minmax(0,1fr) 64px 8px 64px minmax(0,1fr);height:52px}
 .team-name{font-size:20px;padding:0 6px}
 .score-number{top:-14px;font-size:68px;line-height:52px;letter-spacing:-3px}
 #timer-wrapper{height:30px;width:100px}
 #timer{font-size:23px}
}
</style>
</head>
<body>
<div id="scoreboard">
 <div id="score-strip">
  <div id="team-home" class="team-name"><span id="team-home-label">HOME</span></div>
  <div id="score-home" class="score-number">-</div>
  <div aria-hidden="true"></div>
  <div id="score-away" class="score-number">-</div>
  <div id="team-away" class="team-name"><span id="team-away-label">AWAY</span></div>
 </div>
 <div id="timer-wrapper"><div id="timer">--:--</div></div>
</div>
<div id="warning" hidden></div>
<div id="popup" role="status" aria-live="polite" aria-hidden="true">
 <div id="popup-type-label"></div>
 <div id="popup-team-label"></div>
 <div id="popup-player"><span id="popup-number-label"></span><span id="popup-name-label"></span></div>
 <div id="popup-substitution">
  <div class="sub-player"><span class="sub-tag out">OUT</span><span id="popup-out-number" class="sub-number"></span><span id="popup-out-name" class="sub-name"></span></div>
  <div class="sub-player"><span class="sub-tag in">IN</span><span id="popup-in-number" class="sub-number"></span><span id="popup-in-name" class="sub-name"></span></div>
 </div>
</div>
<script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
<script src="./design.js?v=1"></script>
</body>
</html>
